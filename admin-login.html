<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Administración | BurguerTech</title>

    <link rel="stylesheet"
          href="css/estilos.css">

</head>

<body>


    <main class="login-admin">

        <div class="login-caja">

            <h1>
                BurguerTech
            </h1>

            <h2>
                Panel administrativo
            </h2>

            <p>
                Inicia sesión para administrar
                los pedidos.
            </p>


            <form id="login-form">

                <label for="usuario">
                    Usuario
                </label>

                <input
                    type="text"
                    id="usuario"
                    placeholder="Usuario"
                    required
                >


                <label for="password">
                    Contraseña
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Contraseña"
                    required
                >


                <button type="submit">
                    Iniciar sesión
                </button>


                <p
                    id="mensaje-login"
                    class="mensaje-login">
                </p>

            </form>

        </div>

    </main>


    <script>

        const formulario =
            document.getElementById("login-form");


        formulario.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const usuario =
                    document.getElementById(
                        "usuario"
                    ).value;


                const password =
                    document.getElementById(
                        "password"
                    ).value;


                const mensaje =
                    document.getElementById(
                        "mensaje-login"
                    );


                try {

                    const respuesta =
                        await fetch(
                            "/api/login",
                            {

                                method: "POST",

                                headers: {

                                    "Content-Type":
                                        "application/json"

                                },

                                body:
                                    JSON.stringify({

                                        usuario:
                                            usuario,

                                        password:
                                            password

                                    })

                            }
                        );


                    const resultado =
                        await respuesta.json();


                    if (!respuesta.ok) {

                        mensaje.textContent =
                            resultado.mensaje;

                        return;

                    }


                    window.location.href =
                        "/admin.html";


                } catch (error) {

                    mensaje.textContent =
                        "No se pudo conectar con el servidor.";

                }

            }
        );

    </script>

</body>

</html>
